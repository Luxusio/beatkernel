[package]
name = "beatkernel-bms-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "beatkernel-bms-runtime"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["desktop"]
desktop = ["graphics", "dep:winit", "dep:pollster", "dep:arboard"]
graphics = ["dep:wgpu", "dep:bytemuck", "dep:floem_reactive", "dep:ab_glyph"]
browser = ["graphics", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]
browser-audio = ["dep:wasm-bindgen", "dep:js-sys"]
webtransport = ["dep:wtransport", "dep:url", "tokio/sync", "tokio/macros", "tokio/signal", "tokio/io-util"]
asio-sdk = ["beatkernel-platform/asio-sdk"]

[dependencies]
beatkernel = { path = "../../crates/beatkernel" }
beatkernel-platform = { path = "../../crates/beatkernel-platform" }
beatkernel-bms = { path = "../../adapters/beatkernel-bms" }
encoding_rs = "=0.8.35"
claxon = "=0.4.3"
lewton = "=0.10.2"
ogg = "=0.8.0"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "png", "jpeg"] }
nanomp3 = { version = "=0.2.0", default-features = false }
wgpu = { version = "=27.0.1", optional = true }
bytemuck = { version = "=1.24.0", features = ["derive"], optional = true }
winit = { version = "=0.30.13", optional = true }
pollster = { version = "=0.4.0", optional = true }
floem_reactive = { version = "=0.2.0", optional = true }
ab_glyph = { version = "=0.2.32", optional = true }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.129", optional = true }
wasm-bindgen-futures = { version = "=0.4.79", optional = true }
js-sys = { version = "=0.3.106", optional = true }
web-sys = { version = "=0.3.106", features = ["OffscreenCanvas"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "net", "time"] }
wtransport = { version = "=0.7.2", default-features = false, features = ["ring", "quinn"], optional = true }
url = { version = "=2.5.8", optional = true }
