[package]
name = "beatkernel-bms-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "beatkernel-bms-runtime"

[dependencies]
beatkernel = { path = "../../crates/beatkernel" }
beatkernel-platform = { path = "../../crates/beatkernel-platform" }
beatkernel-bms = { path = "../../adapters/beatkernel-bms" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Threading", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
