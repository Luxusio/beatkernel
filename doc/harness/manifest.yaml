version: 7
initialized_at: 2026-09-29
name: BeatKernel
type: library
languages: [rust]
audience: public
maintenance_default: false
build_command: cargo build --workspace --locked
test_command: cargo test --workspace --locked
verify_commands:
  - cargo fmt --all -- --check
  - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  - cargo test --workspace --locked
  - cargo test --workspace --release --locked
  - cargo run -p beatkernel --example transport --locked
  - cargo run -p beatkernel --example binding --locked
  - cargo run -p beatkernel --example chart --locked
  - cargo run -p beatkernel --example judge --locked -- --help
  - cargo run -p beatkernel --example judge --locked -- --fixture
  - cargo run -p beatkernel-platform --example input_inspector --locked
  - cargo run -p beatkernel-platform --example windows_input_inspector --locked -- --help
  - cargo run -p beatkernel-platform --example windows_input_inspector --locked -- --fixture
  - cargo doc --workspace --no-deps --locked
qa:
  default_mode: cli
  browser_qa_supported: false
  desktop_qa_supported: false
  ux_review_supported: false
health_components:
  - name: test
    command: cargo test --workspace --locked
    weight: 1.0
  - name: format
    command: cargo fmt --all -- --check
    weight: 1.0
  - name: clippy
    command: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    weight: 1.0
