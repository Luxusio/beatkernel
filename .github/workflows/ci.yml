name: Rust

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --release --locked
      - run: cargo run -p beatkernel --example transport --locked
      - run: cargo run -p beatkernel --example binding --locked
      - run: cargo run -p beatkernel-platform --example input_inspector --locked
      - run: cargo run -p beatkernel-platform --example windows_input_inspector --locked -- --help
      - run: cargo run -p beatkernel-platform --example windows_input_inspector --locked -- --fixture
      - if: matrix.os == 'windows-latest'
        run: cargo run -p beatkernel-platform --example windows_input_inspector --locked -- --seconds 1
      - run: cargo doc --workspace --no-deps --locked
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.83.0
      - run: cargo test --workspace --locked
